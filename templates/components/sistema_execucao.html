<fieldset>
    <legend class="form-label fw-bold text-muted small text-uppercase">Sistema operacional alvo</legend>
    <div class="btn-group btn-group-sm w-100">
        <input type="radio" class="btn-check" id="os-linux" name="os-execucao" data-os="debian" checked>
        <label class="btn btn-outline-primary" for="os-linux"><i class="bi bi-ubuntu me-1" aria-hidden="true"></i>Linux</label>
        <input type="radio" class="btn-check" id="os-windows" name="os-execucao" data-os="windows">
        <label class="btn btn-outline-primary" for="os-windows"><i class="bi bi-windows me-1" aria-hidden="true"></i>Windows</label>
    </div>
</fieldset>
