<fieldset class="mb-2">

    <div class="btn-group btn-group-sm w-100">
        <input type="radio" class="btn-check" id="modo-sala" name="modo-execucao" data-modo="sala" checked>
        <label class="btn btn-outline-primary" for="modo-sala">Por sala</label>
        <input type="radio" class="btn-check" id="modo-maquina" name="modo-execucao" data-modo="maquina">
        <label class="btn btn-outline-primary" for="modo-maquina">Por máquina</label>
    </div>
</fieldset>
