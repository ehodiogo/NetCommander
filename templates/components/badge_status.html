{% comment %}
Badge de status de resultado de execução.
Uso: {% include 'components/badge_status.html' with status=r.status %}
{% endcomment %}
<span class="badge status-badge
    {% if status == 'sucesso' or status == 'concluido' %}bg-success
    {% elif status == 'erro' or status == 'falha' or status == 'offline' %}bg-danger
    {% else %}bg-warning text-dark{% endif %}">
    {{ rotulo|default:status }}
</span>
