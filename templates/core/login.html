<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'logo-ncc.png' %}">
    <title>NCC | Login</title>
    <link href="{% static 'vendor/fonts/inter-jetbrains.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.css' %}">
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background-color: var(--nc-bg-elevated);
            border: 1px solid var(--nc-border);
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .login-card .brand {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            background: var(--nc-primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-card .form-control {
            background-color: var(--nc-bg-base);
            border: 1px solid var(--nc-border);
            color: var(--nc-text);
            padding: 0.75rem 1rem;
            border-radius: var(--nc-radius-md);
        }
        .login-card .form-control:focus {
            border-color: var(--nc-primary);
            box-shadow: var(--nc-focus-ring);
            background-color: var(--nc-bg-base);
            color: var(--nc-text);
        }
        .btn-login {
            background: var(--nc-primary-gradient);
            border: none;
            border-radius: var(--nc-radius-md);
            padding: 0.75rem;
            font-weight: 600;
            width: 100%;
            color: #fff;
        }
        .btn-login:hover,
        .btn-login:focus {
            opacity: 0.9;
            color: #fff;
        }
        .error-feedback {
            color: var(--nc-danger);
            font-size: 0.875rem;
        }
        .footer-text {
            color: var(--nc-text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <img src="{% static 'logo-ncc.png' %}" alt="Logo" height="48" class="mb-3">
            <div class="brand">NCC NetCommander</div>
            <p class="footer-text mt-2">Acesso restrito</p>
        </div>

        <form method="POST" id="form-login">
            {% csrf_token %}
            {% if erro %}
                <div class="alert alert-danger py-2 small error-feedback">{{ erro }}</div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label small text-muted text-uppercase fw-bold" for="id_username">Usuário</label>
                <input type="text" name="username" id="id_username" class="form-control" placeholder="Digite o usuário" required autofocus autocomplete="username">
            </div>
            <div class="mb-4">
                <label class="form-label small text-muted text-uppercase fw-bold" for="id_password">Senha</label>
                <div class="input-group">
                    <input type="password" name="password" id="id_password" class="form-control" placeholder="Digite a senha" required autocomplete="current-password">
                    <button type="button" class="btn btn-outline-secondary" id="btn-mostrar-senha" aria-label="Mostrar senha" aria-pressed="false">
                        <i class="bi bi-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-login" id="btn-login">
                <span class="spinner-border spinner-border-sm d-none me-2" role="status" aria-hidden="true" id="spinner-login"></span>
                Entrar
            </button>
        </form>

        <p class="text-center footer-text mt-4 mb-0">
            <i class="bi bi-shield-lock me-1" aria-hidden="true"></i> Gestão de Laboratórios via SSH
        </p>
    </div>

    <script type="module" src="{% static 'js/forms.js' %}"></script>
</body>
</html>
