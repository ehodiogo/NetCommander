<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'logo-ncc.png' %}">
    <title>NCC | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: #e1e7ef;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background-color: #161b22;
            border: 1px solid #2d333b;
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .login-card .brand {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .form-control {
            background-color: #0d1117;
            border: 1px solid #2d333b;
            color: #e1e7ef;
            padding: 0.75rem 1rem;
            border-radius: 8px;
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.25);
            background-color: #0d1117;
            color: #e1e7ef;
        }
        .btn-login {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            border-radius: 8px;
            padding: 0.75rem;
            font-weight: 600;
            width: 100%;
            color: #fff;
        }
        .btn-login:hover {
            opacity: 0.9;
            color: #fff;
        }
        .error-feedback {
            color: #f85149;
            font-size: 0.875rem;
        }
        .footer-text {
            color: #8b949e;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <img src="{% static 'logo-ncc.png' %}" alt="Logo" height="48" class="mb-3">
            <div class="brand">NCC NetCommander</div>
            <p class="footer-text mt-2">Acesso restrito</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            {% if erro %}
                <div class="alert alert-danger py-2 small error-feedback">{{ erro }}</div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label small text-muted text-uppercase fw-bold">Usuário</label>
                <input type="text" name="username" class="form-control" placeholder="Digite o usuário" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label small text-muted text-uppercase fw-bold">Senha</label>
                <input type="password" name="password" class="form-control" placeholder="Digite a senha" required>
            </div>
            <button type="submit" class="btn btn-login">Entrar</button>
        </form>

        <p class="text-center footer-text mt-4 mb-0">
            <i class="bi bi-shield-lock me-1"></i> Gestão de Laboratórios via SSH
        </p>
    </div>
</body>
</html>
