{% comment %}Console de disparo: alvo, comando, SO e área de resultados.{% endcomment %}
<div class="card shadow border-0 overflow-hidden mb-5">
    <div class="card-header bg-dark py-3">
        <h5 class="card-title mb-0 text-white"><i class="bi bi-lightning-charge-fill text-warning me-2" aria-hidden="true"></i>Console de Disparo</h5>
    </div>
    <div class="card-body p-4 bg-body-tertiary">
        <div class="row g-4">
            <div class="col-md-5">
                <label class="form-label fw-bold text-muted small text-uppercase">Onde executar?</label>

                <div class="btn-group btn-group-sm mb-2 w-100" role="group" aria-label="Modo de execução">
                    <button type="button" class="btn btn-outline-primary active" id="btn-modo-sala" data-modo="sala">Por Sala</button>
                    <button type="button" class="btn btn-outline-primary" id="btn-modo-maquina" data-modo="maquina">Por Máquina</button>
                </div>

                <select id="sala" class="form-select form-select-lg custom-select mb-2" aria-label="Selecionar sala">
                    {% for s in salas %}
                        <option value="{{ s.id }}">{{ s.nome }} ({{ s.maquinas.count }} PCs)</option>
                    {% endfor %}
                </select>

                <select id="maquina" class="form-select form-select-lg custom-select d-none" aria-label="Selecionar máquina">
                </select>
            </div>
            <div class="col-md-5">
                <label class="form-label fw-bold text-muted small text-uppercase">Qual comando?</label>
                <select id="comando" class="form-select form-select-lg custom-select" aria-label="Selecionar comando">
                    {% for c in comandos %}
                        <option value="{{ c.id }}">{{ c.nome }}</option>
                    {% endfor %}
                </select>
                <div id="os-selector" class="d-none mt-2">
                    <label class="form-label fw-bold text-muted small text-uppercase">SO Alvo</label>
                    <div class="btn-group btn-group-sm w-100" role="group" aria-label="Sistema operacional alvo">
                        <button type="button" class="btn btn-outline-success active" data-os="debian">
                            <i class="bi bi-ubuntu me-1" aria-hidden="true"></i>Linux
                        </button>
                        <button type="button" class="btn btn-outline-primary" data-os="windows">
                            <i class="bi bi-windows me-1" aria-hidden="true"></i>Windows
                        </button>
                    </div>
                </div>
                <div id="preview-comando" class="mt-3 d-none">
                    <label class="form-label fw-bold text-muted small text-uppercase">Comando a executar</label>
                    <div id="preview-linux" class="bg-dark p-2 rounded mb-1 border-start border-success border-3 d-none">
                        <i class="bi bi-ubuntu text-success me-2" aria-hidden="true"></i>
                        <code class="text-success small user-select-all" id="preview-linux-texto"></code>
                    </div>
                    <div id="preview-windows" class="bg-dark p-2 rounded border-start border-primary border-3 d-none">
                        <i class="bi bi-windows text-primary me-2" aria-hidden="true"></i>
                        <code class="text-primary small user-select-all" id="preview-windows-texto"></code>
                    </div>
                </div>
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button class="btn btn-success btn-lg w-100 fw-bold shadow-sm py-3" id="btn-executar">
                    EXECUTAR
                </button>
            </div>
        </div>

        {% include 'core/dashboard/historico.html' %}
    </div>

    <div id="area-resultados" class="p-4 d-none border-top bg-dark-subtle">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0 text-body"><i class="bi bi-terminal me-2" aria-hidden="true"></i>Saída do Sistema</h6>
            <div class="d-flex align-items-center gap-2">
                <span id="progresso-label" class="badge bg-dark rounded-pill">0 / 0</span>
                <button class="btn btn-sm btn-outline-danger d-none" id="btn-cancelar" type="button">
                    <i class="bi bi-x-circle me-1" aria-hidden="true"></i>Cancelar
                </button>
            </div>
        </div>
        <div class="progress progress-thin mb-3" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="barra-progresso" class="progress-bar bg-success" style="width: 0%"></div>
        </div>
        <div class="table-responsive">
            <table class="table table-borderless align-middle" id="tabela">
                <thead class="text-muted small text-uppercase">
                    <tr>
                        <th class="fw-normal">Máquina</th>
                        <th class="fw-normal">IP</th>
                        <th class="fw-normal">SO Detectado</th>
                        <th class="fw-normal">Progresso</th>
                        <th class="fw-normal">Terminal Output</th>
                    </tr>
                </thead>
                <tbody class="bg-body-tertiary rounded-3 shadow-sm">
                </tbody>
            </table>
        </div>
    </div>
</div>
