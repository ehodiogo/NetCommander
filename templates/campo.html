{% load static %}
<div class="mb-3">
    <label for="{{ campo.id_for_label }}" class="form-label fw-bold small text-uppercase">
        {{ campo.label }}
    </label>
    {{ campo }}
    {% if help %}
        <div class="form-text">{{ help }}</div>
    {% elif campo.help_text %}
        <div class="form-text">{{ campo.help_text }}</div>
    {% endif %}
    {% if campo.errors %}
        <div class="invalid-feedback d-block">
            {% for erro in campo.errors %}
                <span class="d-block">{{ erro }}</span>
            {% endfor %}
        </div>
    {% endif %}
</div>
